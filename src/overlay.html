<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2ea" />
    <link rel="stylesheet" href="/style.css" />
    <title>Senku Overlay</title>
  </head>
  <body class="overlay-mini-body">
    <div class="overlay-mini-bar">
      <div class="overlay-mini-drag" title="Drag to move">
        <span class="overlay-mini-icon">✎</span>
        <span class="overlay-mini-note" id="overlay-target-name">Notes</span>
      </div>
      <input
        type="text"
        id="overlay-input"
        class="overlay-mini-input"
        placeholder="Write note & hit Enter..."
        autocomplete="off"
        spellcheck="false"
        maxlength="1000"
        autofocus
      />
      <button type="button" class="overlay-mini-close" id="overlay-close-btn" title="Close (Esc)">✕</button>
    </div>
    <script type="module" src="/overlay.ts"></script>
  </body>
</html>
