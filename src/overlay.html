<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2ea" />
    <link rel="stylesheet" href="/style.css" />
    <title>Senku Overlay</title>
  </head>
  <body class="overlay-mini-body">
    <div class="overlay-mini-bar">
      <div class="overlay-mini-drag" title="Hold & drag to move · Tab to switch Note/Log">
        <span class="overlay-mini-grip" title="Hold & drag to move">⠿</span>
        <span class="overlay-mini-icon" title="Hold & drag to move">✎</span>
        <span class="overlay-mini-note" id="overlay-target-name">Notes</span>
      </div>
      <textarea
        id="overlay-input"
        class="overlay-mini-input"
        rows="1"
        placeholder="Write note · Shift+Enter for new line"
        spellcheck="false"
        maxlength="1000"
        autofocus
      ></textarea>
      <button type="button" class="overlay-mini-close" id="overlay-close-btn" title="Close (Esc)">✕</button>
    </div>
    <script type="module" src="/overlay.ts"></script>
  </body>
</html>
