<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="/style.css" />
    <title>Senku Overlay</title>
  </head>
  <body class="overlay-mini-body">
    <div class="overlay-mini-bar">
      <span class="overlay-mini-drag-handle" id="overlay-drag-handle" title="Senku Overlay · Saves to Documents/Senku Notes/senku.md">✎</span>
      <textarea
        id="overlay-input"
        class="overlay-mini-input"
        rows="1"
        placeholder="Capture to notes · ⇧↵ newline"
        spellcheck="false"
        maxlength="1000"
        autofocus
      ></textarea>
      <button type="button" class="overlay-mini-close" id="overlay-close-btn" title="Close (Esc)" tabindex="-1">✕</button>
    </div>
    <script type="module" src="/overlay.ts"></script>
  </body>
</html>
